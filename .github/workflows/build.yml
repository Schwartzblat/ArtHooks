name: build

on:
  push:
    branches: [main]
    # Both forms, because JitPack serves a tag under its literal name: tag "1.0.1" is version
    # "1.0.1", but tag "v1.0.1" is version "v1.0.1". Bare semver is what you want; "v*" stays
    # matched so an old-style tag still builds and releases instead of silently doing nothing.
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the library and the demo
        run: ./gradlew :arthooks:assembleRelease :app:assembleDebug

      # JNI binds by mangled symbol name, and a rename fails silently until the method is called.
      - name: Check JNI symbols
        run: ./tools/check-jni-symbols.sh

      - uses: actions/upload-artifact@v4
        with:
          name: arthooks-aar
          path: arthooks/build/outputs/aar/*.aar
          if-no-files-found: error

  self-test:
    name: self-test on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 33 is minSdk; 36 is what the library has been verified against on hardware. Both run
        # x86_64, so this is also the only coverage the x86_64 trampoline gets.
        api-level: [33, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes the x86_64 emulator usable on a GitHub runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the self-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tools/run-selftest.sh

  # Turns a tag into an actual release: builds the artifacts under the coordinate JitPack will
  # serve, attaches them to the GitHub release, and asks JitPack to build the tag so the Maven
  # coordinate resolves immediately instead of on the first consumer's request.
  release:
    name: release ${{ github.ref_name }}
    needs: [build, self-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and upload assets. Everything else here is read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the coordinate
        id: coord
        run: |
          # A leading "v" is tolerated but stripped, so tag v1.0.1 and tag 1.0.1 both produce
          # Maven version 1.0.1 in the attached artifacts. JitPack's own version is the raw tag.
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "group=com.github.${GITHUB_REPOSITORY/\//.}"
          } >> "$GITHUB_OUTPUT"

      - name: Build the release artifacts
        run: |
          ./gradlew :arthooks:publishToMavenLocal \
            -Pgroup="${{ steps.coord.outputs.group }}" \
            -Pversion="${{ steps.coord.outputs.version }}"

      # Fails the release rather than publishing an empty one: the AAR and POM are the two files a
      # consumer cannot do without.
      - name: Collect and verify them
        id: assets
        run: |
          version="${{ steps.coord.outputs.version }}"
          staged="$HOME/.m2/repository/com/github/$GITHUB_REPOSITORY/arthooks/$version"

          test -f "$staged/arthooks-$version.aar"
          test -f "$staged/arthooks-$version.pom"

          mkdir -p release-assets
          cp "$staged"/arthooks-"$version"*.aar release-assets/
          cp "$staged"/arthooks-"$version"*.pom release-assets/
          cp "$staged"/arthooks-"$version"*-sources.jar release-assets/ 2>/dev/null || true

          # Named explicitly rather than ./*, so a re-run cannot checksum the checksum file.
          ( cd release-assets && sha256sum arthooks-* > SHA256SUMS.txt )
          ls -l release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Attach them to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # The release may already exist -- created by hand, or by a re-run of this job.
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release view "$tag"

      # Best-effort: JitPack builds a tag lazily, on the first request for it. Asking here means the
      # coordinate is live as soon as the tag is, rather than making the first consumer wait through
      # a multi-minute build. Never fails the release -- the GitHub assets above are already
      # published, and a consumer's own request would trigger the build anyway.
      - name: Ask JitPack to build the tag
        continue-on-error: true
        run: |
          url="https://jitpack.io/com/github/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/build.log"
          echo "requesting $url"
          code="$(curl -sS -m 900 -o jitpack-build.log -w '%{http_code}' "$url" || echo 000)"
          echo "HTTP $code"
          echo "--- last 40 lines of the JitPack build log ---"
          tail -40 jitpack-build.log 2>/dev/null || echo "(no log returned)"
          test "$code" = "200"
